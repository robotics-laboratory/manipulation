# Docker Compose for Isaac SO-ARM101 + LeRobot/SmolVLA Bridge
#
# Usage:
#   cd docker && docker compose build                     # Build the image
#   cd docker && docker compose run --rm isaac-bridge     # Headless (training/inference)
#   cd docker && docker compose run --rm isaac-bridge-x11 # With X11 GUI (visualization)
#
# X11 forwarding requires: xhost +local:docker (run on host before starting)

services:
  # ---- Headless mode (training, inference, no GUI) ----
  isaac-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BASE_IMAGE=${BASE_IMAGE:-nvcr.io/nvidia/isaac-lab:2.3.2}
    image: isaac-bridge:latest
    container_name: isaac-bridge
    network_mode: host
    # GPU camera rendering needs more shared memory than Docker's 64MB default
    shm_size: '4g'
    environment:
      # Used by isaac_so_arm101/scripts/rsl_rl/log_paths.resolve_checkpoint_cli_path for --checkpoint paths
      - PROJECT_DIR=/workspace/isaac-bridge
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - OMNI_KIT_ALLOW_ROOT=1
      # Ensure full GPU access (Vulkan/OpenGL/display) — not just compute
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # --- Live-edit: mount project directories from host ---
      - ../camera_poses.json:/workspace/isaac-bridge/camera_poses.json
      - ../camera_poses.example.json:/workspace/isaac-bridge/camera_poses.example.json
      - ../src:/workspace/isaac-bridge/src
      - ../scripts:/workspace/isaac-bridge/scripts
      - ../isaac_so_arm101/src:/workspace/isaac-bridge/isaac_so_arm101/src
      # RSL-RL checkpoints & TensorBoard: train/play use isaac_so_arm101/logs/rsl_rl/ (see isaac_so_arm101/scripts/rsl_rl/log_paths.py)
      - ../isaac_so_arm101/logs:/workspace/isaac-bridge/isaac_so_arm101/logs
      # Curated final model_*.pt copies (stable paths for play / datasets; see isaac_so_arm101/checkpoints/README.md)
      - ../isaac_so_arm101/checkpoints:/workspace/isaac-bridge/isaac_so_arm101/checkpoints
      # Curated LeIsaac checkpoints used for dataset collection.
      - ../good_checkpoints:/workspace/isaac-bridge/good_checkpoints:ro
      - ../vla_checkpoints:/workspace/isaac-bridge/vla_checkpoints:ro
      # LeIsaac RSL-RL default logs/checkpoints path used by train.py (logs/rsl_rl/...).
      - ../logs:/workspace/isaac-bridge/logs
      # --- Persistent caches (avoid re-downloading between runs) ---
      - isaac-cache-kit:/isaac-sim/kit/cache
      - isaac-cache-pip:/root/.cache/pip
      - isaac-cache-gl:/root/.cache/nvidia/GLCache
      - isaac-cache-compute:/root/.nv/ComputeCache
      - isaac-cache-ov:/root/.cache/ov
      - isaac-logs:/root/.nvidia-omniverse/logs
      # --- HuggingFace cache (models + datasets persist across runs) ---
      - huggingface-cache:/root/.cache/huggingface
      # --- Output directory for saved data/logs ---
      - ../output:/workspace/isaac-bridge/output
      # --- Videos recorded to the default policy_inference.py video folder ---
      - ../videos:/workspace/isaac-bridge/videos
      # --- Optional: host Isaac Lab package (use local patches, e.g. utils __init__ without eager mesh/pxr).
      # Requires repo layout: IsaacLab/manipulation/docker with ../../source/isaaclab present.
      # Uncomment if /workspace/isaaclab in the image is stale vs your host clone:
      # - ../../source/isaaclab:/workspace/isaaclab/source/isaaclab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    entrypoint: bash

  # ---- X11 mode (GUI visualization, camera debugging) ----
  isaac-bridge-x11:
    extends:
      service: isaac-bridge
    container_name: isaac-bridge-x11
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0

volumes:
  isaac-cache-kit:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-cache-ov:
  isaac-logs:
  huggingface-cache:
