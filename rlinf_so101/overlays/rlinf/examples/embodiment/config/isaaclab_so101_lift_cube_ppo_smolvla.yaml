defaults:
  - env/so101_lift_cube@env.train
  - env/so101_lift_cube@env.eval
  - model/smolvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
      env: 0
      rollout:
        node_group: "rollout"
        placement: 0
      actor: 0

  node_groups:
    - label: "rollout"
      node_ranks: all
      env_configs:
        - node_ranks: all
          env_vars:
            - OMP_NUM_THREADS: 8

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_so101_lift_cube_ppo_smolvla"
    logger_backends: ["tensorboard"]

  max_epochs: 5
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 0
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 1
    max_episode_steps: 64
    max_steps_per_rollout_epoch: 64
    use_fixed_reset_state_ids: False
    trajectory_reward:
      reference_path: null
  eval:
    total_num_envs: 1
    max_episode_steps: 64
    max_steps_per_rollout_epoch: 64
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  model:
    model_path: "/workspace/RLinf/models/SmolVLA"
    model_type: "smolvla"
    action_dim: 6
    num_action_chunks: 1
    add_value_head: True
    state_dim: 6
    hidden_dim: 256
    residual_scale: 0.2
    action_low: -3.2
    action_high: 3.2
    smolvla:
      noise_method: "gaussian_fixed"
      noise_level: 0.08
      policy_language_instruction: "Lift the red cube up."
  optim:
    lr: 3.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
